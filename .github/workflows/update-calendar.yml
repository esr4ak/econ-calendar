name: Ekonomik takvimi guncelle

on:
  schedule:
    # Turkiye UTC+3'te sabit (DST yok) - TR saatiyle 12:00, 17:00 ve
    # gece yarisi (00:00) calisir. UTC karsiliklari: 09:00, 14:00, 21:00.
    - cron: "0 9,14,21 * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle de tetiklenebilir

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: scraper.py calistir
        run: python scraper.py

      - name: Degisiklik varsa commit+push et
        run: |
          git config user.name "econ-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/economic_calendar.json; then
            echo "Veri degismedi, commit atlaniyor."
          else
            git add data/economic_calendar.json
            git commit -m "chore: ekonomik takvim verisini guncelle"
            git push
          fi
