<style>
  :root {

  /* ---- Stablex header ---- */
  .site-header { background: #000; padding: 18px 24px; }
  .site-header .inner {

  .logo-block { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-block .word { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: #fff; }

  .header-badge {

  .stat.stat-actual .stat-value.stat-empty { color: var(--border); font-weight: 700; }

    margin-top: 16px; padding: 13px 16px; border-radius: 12px;
    background: var(--accent-dim); border: 1px solid #f6c6c7;
    display: flex; align-items: flex-start; gap: 10px;
  }

  .summary-box .summary-label {

  }
  .meta { color: var(--text-dim); font-size: 12px; font-weight: 600; margin-top: 18px; }

    .page { padding: 20px 14px 48px; }
    h1 { font-size: 20px; }
    .info-grid { grid-template-columns: 1fr; }
    .event-card { padding: 16px 16px; border-radius: 14px; }

<script>
// Cache-busting: GitHub Pages/tarayici JSON'u agresif cache'leyebilir,
// her yuklemede taze veri gelsin diye zaman damgasi ekleniyor.
const MAIN_TABS = [
  { key: "past_months",          label: "Geçmiş Aylar" },
  { key: "current_month",        label: "Bu Ay (Tümü)" },
  { key: "current_month_weekly", label: "Bu Ay (Haftalık)" },
];

const MONTH_TR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

let dataset = null;
let activeMain = "current_month";
let activeSub = null;

async function loadData() {
  dataset = JSON.parse(document.getElementById("calendar-data").textContent);
  document.getElementById("generatedAt").textContent =
    `${dataset.country} · Yalnızca yüksek etkili (3/3) etkinlikler · Son güncelleme: ${dataset.generated_at}`;
  renderMainTabs();
  setActiveMain(pickDefaultMain());
}

function pickDefaultMain() {
  if (dataset.current_month && Object.keys(dataset.current_month).length) return "current_month";
  if (dataset.current_month_weekly && Object.keys(dataset.current_month_weekly).length) return "current_month_weekly";
  return "past_months";
}

function renderMainTabs() {
  const wrap = document.getElementById("mainTabs");
  wrap.innerHTML = "";
  MAIN_TABS.forEach(tab => {
    const btn = document.createElement("button");
    btn.className = "main-tab" + (tab.key === activeMain ? " active" : "");
    btn.textContent = tab.label;
    btn.onclick = () => setActiveMain(tab.key);
    wrap.appendChild(btn);
  });
}

function setActiveMain(key) {
  activeMain = key;
  renderMainTabs();
  renderSubTabs();
}

function getSubKeysForMain() {
  if (activeMain === "current_month") return Object.keys(dataset.current_month || {}).sort();
  if (activeMain === "past_months") return Object.keys(dataset.past_months || {}).sort().reverse();
  if (activeMain === "current_month_weekly") {
    return Object.keys(dataset.current_month_weekly || {}).sort((a, b) => {
      const na = parseInt(a.replace("week_", ""), 10);
      const nb = parseInt(b.replace("week_", ""), 10);
      return na - nb;
    });
  }
  return [];
}

function subTabLabel(key) {
  if (activeMain === "current_month_weekly") return dataset.current_month_weekly[key]?.label || key;
  return key;
}

function renderSubTabs() {
  const wrap = document.getElementById("subTabs");
  wrap.innerHTML = "";
  const keys = getSubKeysForMain();

  if (!keys.length) {
    renderCards([]);
    return;
  }
  if (!keys.includes(activeSub)) activeSub = keys[0];

  keys.forEach(key => {
    const btn = document.createElement("button");
    btn.className = "sub-tab" + (key === activeSub ? " active" : "");
    btn.textContent = subTabLabel(key);
    btn.onclick = () => { activeSub = key; renderSubTabs(); };
    wrap.appendChild(btn);
  });

  renderCards(getEventsForActiveSub());
}

function getEventsForActiveSub() {
  if (!activeSub) return [];
  if (activeMain === "current_month") return dataset.current_month[activeSub] || [];
  if (activeMain === "past_months") return dataset.past_months[activeSub] || [];
  if (activeMain === "current_month_weekly") return dataset.current_month_weekly[activeSub]?.events || [];
  return [];
}

function formatDateHeading(isoDate) {
  const [y, m, d] = isoDate.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const weekday = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"][dt.getUTCDay()];
  return `${weekday}, ${d} ${MONTH_TR[m - 1]} ${y}`;
}

function renderCards(events) {
  const list = document.getElementById("cardList");
  const countEl = document.getElementById("rowCount");
  list.innerHTML = "";

  if (!events.length) {
    list.innerHTML = `<div class="empty-state">Bu aralık için yüksek etkili etkinlik bulunamadı.</div>`;
    countEl.textContent = "";
    return;
  }

  let lastDate = null;
  events.forEach(ev => {
    if (ev.date !== lastDate) {
      lastDate = ev.date;
      const divider = document.createElement("div");
      divider.className = "date-divider";
      divider.textContent = formatDateHeading(ev.date);
      list.appendChild(divider);
    }

    const isReleased = !!ev.actual;
    const card = document.createElement("div");
    card.className = "event-card";

    const infoGrid = (ev.meaning || ev.market_impact) ? `
      <div class="info-grid">
        ${ev.meaning ? `<div class="info-box"><h3>Ne Anlama Gelir?</h3><p>${escapeHtml(ev.meaning)}</p></div>` : ""}
        ${ev.market_impact ? `<div class="info-box"><h3>Piyasa Etkisi</h3><p>${escapeHtml(ev.market_impact)}</p></div>` : ""}
      </div>` : "";

    const summaryBox = ev.summary ? `
      <div class="summary-box">
        <span class="dot"></span>
        <div>
          <p class="summary-label">Anlık Durum Özeti</p>
          <p class="summary-text">${escapeHtml(ev.summary)}</p>
        </div>
      </div>` : "";

    card.innerHTML = `
      <div class="card-top">
        <div>
          <span class="time-badge">${ev.time || "—"} (ET)</span>
          <h2 class="event-title">${escapeHtml(ev.event)}</h2>
        </div>
        <span class="status-badge ${isReleased ? "released" : "pending"}">${isReleased ? "Açıklandı" : "Bekleniyor"}</span>
      </div>
      ${infoGrid}
      <div class="stats-row">
        <div class="stat">
          <div class="stat-label">Önceki</div>
          <div class="stat-value">${escapeHtml(ev.previous) || "—"}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Beklenti</div>
          <div class="stat-value">${escapeHtml(ev.forecast) || "—"}</div>
        </div>
        <div class="stat stat-actual">
          <div class="stat-label">Açıklanan</div>
          <div class="stat-value${isReleased ? "" : " stat-empty"}">${isReleased ? escapeHtml(ev.actual) : "—"}</div>
        </div>
      </div>
      ${summaryBox}
    `;
    list.appendChild(card);
  });

  countEl.textContent = `${events.length} yüksek etkili etkinlik listeleniyor`;
}

function escapeHtml(str) {
  if (!str) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

loadData();
</script>
</body>
</html>
